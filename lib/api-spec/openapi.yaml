openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: recipes
    description: Recipe operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /recipes/search:
    get:
      operationId: searchRecipes
      tags: [recipes]
      summary: Search recipes by ingredients
      description: Fetches recipes from Spoonacular matching the given ingredients
      parameters:
        - name: ingredients
          in: query
          required: true
          schema:
            type: string
          description: Comma-separated list of ingredients
      responses:
        "200":
          description: Recipe search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecipeSearchResult"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    RecipeSearchResult:
      type: object
      properties:
        recipes:
          type: array
          items:
            $ref: "#/components/schemas/SpoonacularRecipe"
      required:
        - recipes
    RecipeIngredient:
      type: object
      properties:
        amount:
          type: number
          description: Base amount for the recipe's default serving count
        unit:
          type: string
        name:
          type: string
        original:
          type: string
          description: Full original string e.g. "2 cloves garlic, minced"
      required:
        - amount
        - unit
        - name
        - original
    SpoonacularRecipe:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        image:
          type: string
        readyInMinutes:
          type: integer
        servings:
          type: integer
          description: Default serving count from Spoonacular
        ingredients:
          type: array
          items:
            $ref: "#/components/schemas/RecipeIngredient"
        instructions:
          type: array
          items:
            type: string
          description: Ordered list of cooking step strings
      required:
        - id
        - title
        - image
        - readyInMinutes
        - servings
        - ingredients
        - instructions
